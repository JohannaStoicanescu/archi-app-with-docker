  database:
    container_name: mongo-user-service
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongodb
    ports:
      - "27017:27017"
    volumes:
      - data:/data/db
    networks:
      - app-network

volumes:
  data:
    driver: local

networks:
  app-network:
    driver: bridge
