services:
  user-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    env_file:
      - .env
    environment:
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - USER_SERVICE_MONGO_USERNAME=${USER_SERVICE_MONGO_USERNAME}
      - USER_SERVICE_MONGO_PASSWORD=${USER_SERVICE_MONGO_PASSWORD}
      - USER_SERVICE_MONGO_DATABASE=${USER_SERVICE_MONGO_DATABASE}
      - USER_SERVICE_MONGO_TEST_DATABASE=${USER_SERVICE_MONGO_TEST_DATABASE}
    ports:
      - "4001:4001"
    volumes:
      - ./user-service:/user-service
    networks:
      - app-network

